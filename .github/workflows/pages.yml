name: Deploy to GitHub Pages

# One app, one build. The landing page, sign-in and dashboard are routes in the
# same bundle, so Pages serves a site where the marketing half is fully
# functional and the signed-in half says plainly what it is missing.
#
# What it is missing is the server: the dashboard needs it to read the chain and
# add up the books, and a static host cannot run one. The product routes become
# live the moment VITE_API_BASE points at a hosted Remi server — host server/
# somewhere and set a repository variable named API_BASE to its origin
# (Settings → Variables).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy replaces a waiting one, but never cancels a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile contracts
        # Regenerates the ABIs the app imports, so a stale generated file in the
        # repo can never ship a build that disagrees with contracts/.
        run: npm run compile

      - name: Test
        run: npm test

      - name: Build
        env:
          # Pages serves this repo under /Remi/.
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r app/dist/. _site/
          # Without this, Pages runs Jekyll and drops files beginning with _.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
