name: Deploy to GitHub Pages

# The marketing page is fully static and works as-is. The app is deployed too,
# but it needs the Remi server to read the chain and add up the books, and a
# static host cannot run one — so it is deployed as a shell that says so, and
# becomes live the moment VITE_API_BASE points at a hosted server.
#
# To make the deployed app functional, host server/ somewhere and set a
# repository variable named API_BASE to its origin (Settings → Variables).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy replaces a waiting one, but never cancels a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile contracts
        # Regenerates the ABIs the app imports, so a stale generated file in the
        # repo can never ship a build that disagrees with contracts/.
        run: npm run compile

      - name: Test
        run: npm test

      - name: Build app
        env:
          # Pages serves this repo under /Remi/, and the app sits beneath it.
          BASE_PATH: /${{ github.event.repository.name }}/app/
          VITE_API_BASE: ${{ vars.API_BASE }}
        run: npm run build --workspace app

      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp -r app/dist _site/app
          # Without this, Pages runs Jekyll and drops files beginning with _.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
